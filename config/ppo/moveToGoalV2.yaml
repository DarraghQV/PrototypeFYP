behaviors:
  MoveToGoal:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 1.0e-8
    max_steps: 700000
    time_horizon: 64
    summary_freq: 10000

environment_parameters:
  wall_height:
    curriculum:
      - name: Extra Goals Training
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
        value: -1.0  

      - name: No Wall
        completion_criteria:
          measure: reward  
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 0.0  

      - name: Introduce Easy Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
          require_reset: true
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 1.0
            max_value: 2.0

      - name: Medium Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
          require_reset: true
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 3.0
            max_value: 4.0

      - name: Final Wall Height
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
          require_reset: true
        value: 5.25

      - name: New Platform
        value: 5.3  

  learning_rate:
    curriculum:
      - name: Extra Goals Training
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
        value: 3.0e-4

      - name: No Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 3.0e-4

      - name: Introduce Easy Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 3.0e-4

      - name: Medium Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 3.0e-4

      - name: Final Wall Height
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 3.0e-4

      - name: New Platform
        value: 5.0e-4

  curiosity_strength:
    curriculum:
      - name: Extra Goals Training
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
        value: 0.01  

      - name: No Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 1.0e-8  

      - name: Introduce Easy Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 1.0e-8  

      - name: Medium Wall
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 1.0e-8  

      - name: Final Wall Height
        completion_criteria:
          measure: reward
          behavior: MoveToGoal
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8  
        value: 1.0e-8  

      - name: New Platform
        value: 0.01  
